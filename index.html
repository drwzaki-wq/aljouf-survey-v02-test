*{box-sizing:border-box}
body{
  margin:0;

  font-family:var(--font-body);

  text-align:right;
  padding-inline:16px;
  padding-block:14px 90px;
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto}

/* top bar */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px);
  z-index:20; background:var(--bg);
  padding-block:8px 12px; margin-inline:-16px; padding-inline:16px;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--border)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(155deg,var(--primary),var(--primary-ink));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:13px;
}
.brand .name{font-family:var(--font-head);font-weight:700;font-size:14.5px}
.brand .name small{display:block;font-family:var(--font-body);font-weight:400;color:var(--text-muted);font-size:11.5px}
.step-pill{
  font-size:12px;color:var(--text-muted);background:var(--surface-2);
  border:1px solid var(--border); padding:4px 10px;border-radius:999px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.progress-track{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;transition:width .35s ease}
.section-label{margin-top:8px;font-size:12.5px;color:var(--primary-ink);font-weight:700}

/* card */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 18px; box-shadow:var(--shadow); margin-top:14px;
}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-code{
  font-family:var(--font-head); font-size:11px; font-weight:700; color:var(--primary-ink);
  background:var(--primary-tint); padding:3px 8px; border-radius:7px; letter-spacing:.02em;
}
.q-req{font-size:11px;color:var(--danger);background:var(--danger-tint);padding:3px 8px;border-radius:7px;font-weight:700}
.q-opt-tag{font-size:11px;color:var(--text-muted);background:var(--surface-2);padding:3px 8px;border-radius:7px}
.q-text{font-family:var(--font-head);font-weight:700;font-size:18px;line-height:1.5;margin-bottom:6px}
.q-help{color:var(--text-muted);font-size:13.5px;margin-bottom:16px}
.q-audience{font-size:12px;color:var(--accent);margin-bottom:14px;font-weight:600}

.options{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:12px 12px;
  border:1.5px solid var(--border); border-radius:11px; cursor:pointer; background:var(--surface);
  transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--primary)}
.opt.checked{border-color:var(--primary); background:var(--primary-tint)}
.opt.disabled{opacity:.42; cursor:not-allowed}
.opt input{margin-top:3px; accent-color:var(--primary); width:17px;height:17px;flex:none}
.opt .lbl{flex:1; font-size:14.5px}
.opt .rank-badge{
  flex:none; width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.other-field{margin-top:8px; margin-right:27px}
input[type=text], textarea{
  width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px;
  font-family:inherit; font-size:14.5px; background:var(--surface); color:var(--text);
}
textarea{min-height:96px; resize:vertical}
input[type=text]:focus, textarea:focus{outline:2px solid var(--primary); outline-offset:1px}
.hint{font-size:12px;color:var(--text-muted); margin-top:8px}
.limit-note{font-size:12px;color:var(--accent); margin-top:8px; font-weight:600}
.err{
  margin-top:12px; background:var(--danger-tint); color:var(--danger); border:1px solid var(--danger);
  border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600;
}
.empty-pool{color:var(--text-muted); font-size:13.5px; padding:10px 0}

.navbar{
  position:fixed; inset-inline:0; bottom:0; z-index:30;

  box-shadow:0 -6px 18px -12px rgba(0,0,0,.25);

.navbar .wrap{display:flex; gap:10px}
.btn{
  appearance:none; border:none; border-radius:11px; padding:12px 18px; font-size:14.5px; font-weight:700;
  cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary{background:var(--primary); color:#fff; flex:1}
.btn-primary:disabled{opacity:.5; cursor:not-allowed}
.btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border)}
.btn-accent{background:var(--accent); color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px}

/* intro / end / done */
.hero{margin-top:10px}
.hero-badge{
  display:inline-block; font-size:12px; font-weight:700; color:var(--accent-ink,var(--accent));
  background:var(--accent-tint); padding:5px 11px; border-radius:999px; margin-bottom:12px;
}
.hero h1{font-size:23px; margin-bottom:10px}
.hero p{color:var(--text-muted); font-size:14.5px; margin:0 0 10px}
.notice{
  border:1.5px dashed var(--accent); background:var(--accent-tint); border-radius:12px;
  padding:12px 14px; font-size:13px; color:var(--text); margin-top:16px;
}
.notice b{color:var(--accent-ink,var(--accent))}
.info-grid{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.info-row{background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:12px 13px}
.info-row .k{font-weight:700; font-size:13px; margin-bottom:3px; color:var(--primary-ink)}
.info-row .v{font-size:13.5px; color:var(--text-muted)}

/* review */
.rev-item{border-bottom:1px solid var(--border); padding:13px 0}
.rev-item:last-child{border-bottom:none}
.rev-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.rev-q{font-weight:700; font-size:13.5px; flex:1}
.rev-ans{font-size:14px; color:var(--text-muted); margin-top:5px}
.rev-ans.empty{color:var(--border); font-style:italic}
.rev-edit{
  flex:none; font-size:12px; color:var(--primary); background:none; border:none; cursor:pointer; font-weight:700;
  padding:2px 4px;
}
.section-divider{
  font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--accent-ink,var(--accent));
  margin:18px 0 6px; padding-bottom:4px; border-bottom:2px solid var(--accent-tint);
}
.section-divider:first-child{margin-top:0}

/* done */
.done-icon{
  width:56px;height:56px;border-radius:50%;background:var(--success-tint);color:var(--success);
  display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;
}
.export-row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
pre.data-preview{
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px;
  font-size:11.5px; overflow-x:auto; direction:ltr; text-align:left; max-height:260px; color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}

@media (min-width:560px){
  body{padding-inline:24px}
  .card{padding:26px 26px}
  .q-text{font-size:19.5px}
  .navbar .wrap{max-width:720px}
}

/* خريطة الدخول إلى المسار التخصصي بحسب R01 (primary_role) — مطابقة لورقة «خريطة المسارات».
   ملاحظة/تعارض: لا تعرّف ورقة «خريطة المسارات» مساراً لقيمة OTHER في R01؛
   اعتمدنا هنا أن من اختار "دور آخر" ينتقل مباشرة إلى بطاقة الحالة التطبيقية (CS01)
   دون مسار تخصصي ودون وحدة الهوية العمرانية. هذا افتراض ينبغي اعتماده أو تعديله. */
var ENTRY_BY_ROLE = {
  CONSULT:"CN01", LICENSE:"LN01", INSPECT:"IN01", SECTOR:"SC01",
  CONTRACT:"CT01", OPERATE:"OP01", ACADEMIC:"AC01"
};
var OTHER_ROLE_ENTRY = "CS01";

/* أسئلة بطاقة الحالة التطبيقية القابلة للتكرار (بيانات الحالة نفسها، دون سؤالي التحكم CS01/CS14) */
var CASE_FIELD_IDS = ["CS02","CS03","CS04","CS05","CS06","CS07","CS08","CS09","CS10","CS11","CS12","CS13"];
var CASE_FIELDS_WITH_OTHER = CASE_FIELD_IDS.filter(function(id){
  return (TRACK_OPT[id]||[]).some(function(o){return o.other;});
});
var MAX_CASES = 3;

var TRACK_IDS = Object.keys(TRACK_Q);
var TRACK_NONCASE_IDS = TRACK_IDS.filter(function(id){ return id.slice(0,2)!=="CS"; });
var TRACK_QUESTIONS_WITH_OTHER = TRACK_NONCASE_IDS.filter(function(id){
  return (TRACK_OPT[id]||[]).some(function(o){return o.other;});
}).map(function(id){ return TRACK_Q[id].varName; });

/* تقدير تقريبي لعدد أسئلة كل مسار (لعرض شريط تقدم تقريبي فقط) */
var TRACK_LEN_ESTIMATE = {CONSULT:12,LICENSE:12,INSPECT:11,SECTOR:10,CONTRACT:10,OPERATE:10,ACADEMIC:10};
var TRACK_HAS_IDENTITY = {CONSULT:1,LICENSE:1,INSPECT:1,SECTOR:1,ACADEMIC:1,CONTRACT:0,OPERATE:0};

/* ---------------------------------------------------------------------
   الحالة العامة
--------------------------------------------------------------------- */
var answers = {};        // varName -> value
var otherTexts = {};     // varName -> نص التوضيح لخيار "أخرى"
var screen = "intro";    // intro | question | declined | track | review | done
var qIndex = 0;
var lastError = "";
var submitState = "idle";  // idle | sending | sent | failed
var hasSubmitted = false;

/* حالة المسار التخصصي (v0.2) */
var trackNodeId = null;        // معرّف السؤال الحالي داخل شجرة المسار
var trackStack = [];           // سجل التنقل للخلف داخل المسار
var visitedTrackNodes = {};    // id -> true لكل سؤال مسار ظهر فعلياً للمشارك
var caseIterationIndex = 0;    // فهرس بطاقة الحالة الجارية (0 = الحالة الأولى)
var caseRecords = [];          // بطاقات الحالة المكتملة (حتى 3 عناصر)

function submitResponse(obj){
  if(hasSubmitted) return;
  hasSubmitted = true;
  if(!SUBMIT_URL){ submitState = "failed"; render(); return; }
  submitState = "sending"; render();
  fetch(SUBMIT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(obj)
  }).then(function(){
    submitState = "sent"; render();
  }).catch(function(){
    submitState = "failed"; render();
  });
}

function applicable(q){ return q.showIf(answers); }
function applicableList(){ return Q.filter(applicable); }

function firstApplicableFrom(i, dir){
  while(i>=0 && i<Q.length){
    if(applicable(Q[i])) return i;
    i += dir;
  }
  return dir>0 ? Q.length : -1;
}

/* ---------------------------------------------------------------------
   محرك المسار التخصصي (رسم بياني موجَّه يقوده حقل "next" في المصفوفة)
--------------------------------------------------------------------- */

/* يحوّل سؤال مسار إلى كائن سؤال بنفس شكل عناصر Q، ليعاد استخدامه في
   دوال العرض والتحقق والمراجعة العامة دون تكرار كود. */
function trackQuestionObj(id){
  var meta = TRACK_Q[id];
  return {
    id: id,
    section: meta.track,
    varName: meta.varName,
    type: meta.type,
    required: meta.required,
    max: meta.max,
    text: meta.text,
    help: meta.help,
    audience: meta.track,
    options: TRACK_OPT[id] || [],
    poolFrom: null
  };
}

/* السؤال المعروض حالياً، أياً كان مصدره (الجزء المشترك أو المسار التخصصي) */
function currentQ(){
  if(screen==="question") return Q[qIndex];
  if(screen==="track") return trackQuestionObj(trackNodeId);
  return null;
}

/* هل يظهر سؤال مسار معيّن بحسب شرط condOn (يخص CN07 وLN06 فقط) */
function trackApplicable(id){
  var meta = TRACK_Q[id];
  if(!meta.condOn) return true;
  /* condOn.dep يشير إلى رمز سؤال (مثل "CN06")، وليس اسم متغيره؛ يُحوَّل هنا إلى varName */
  var depVarName = TRACK_Q[meta.condOn.dep] ? TRACK_Q[meta.condOn.dep].varName : meta.condOn.dep;
  return meta.condOn.values.indexOf(answers[depVarName]) > -1;
}

/* يتبع حقل next بصورة تسلسلية متجاوزاً أي سؤال غير منطبق (condOn)،
   حتى يصل إلى أول سؤال منطبق أو نهاية السلسلة (null => "REVIEW"). */
function resolveNextAfter(id){
  var n = TRACK_Q[id].next;
  while(n && !trackApplicable(n)){
    n = TRACK_Q[n].next;
  }
  return n || "REVIEW";
}

/* يدخل عقدة مسار جديدة ويسجلها كمعروضة فعلياً للمشارك (تُستخدم لاحقاً
   لتحديد الحقول التي تُصدَّر بقيمة فعلية مقابل الحقول الفارغة). */
function gotoTrackNode(id){
  trackNodeId = id;
  visitedTrackNodes[id] = true;
}

/* بطاقة الحالة التطبيقية: أخذ لقطة من الإجابات الحالية للحقول القابلة
   للتكرار، ثم حفظها في caseRecords قبل الانتقال أو تفريغ الحقول لحالة جديدة. */
function snapshotCurrentCase(){
  var rec = {};
  CASE_FIELD_IDS.forEach(function(id){
    var meta = TRACK_Q[id];
    rec[meta.varName] = answers[meta.varName] !== undefined ? answers[meta.varName] : (meta.type==="multi" ? [] : "");
    rec[meta.varName + "_other_text"] = otherTexts[meta.varName] || "";
  });
  caseRecords.push(rec);
}

function clearCaseFields(){
  CASE_FIELD_IDS.forEach(function(id){
    var meta = TRACK_Q[id];
    delete answers[meta.varName];
    delete otherTexts[meta.varName];
  });
}

/* عكس snapshotCurrentCase عند الرجوع للخلف عبر حد تكرار بطاقة الحالة */
function restoreLastCase(){
  var rec = caseRecords.pop();
  if(!rec) return;
  caseIterationIndex = Math.max(0, caseIterationIndex - 1);
  CASE_FIELD_IDS.forEach(function(id){
    var meta = TRACK_Q[id];
    if(rec[meta.varName] !== undefined) answers[meta.varName] = rec[meta.varName];
    if(rec[meta.varName + "_other_text"]) otherTexts[meta.varName] = rec[meta.varName + "_other_text"];
  });
}

/* منطق الانتقال الخاص بعقد التفريع الأربع (CS01, CS06, CS14) + الانتقال
   العام القائم على next لبقية أسئلة المسار (بما فيها FN06 التي تنهي المسار). */
function advanceFromTrack(fromId){
  if(fromId==="CS01"){
    return answers.case_add === "YES" ? "CS02" : "FN01";
  }
  if(fromId==="CS06"){
    return answers.case_reference_known === "YES" ? "CS07" : "CS08";
  }
  if(fromId==="CS14"){
    if(answers.case_repeat==="YES" && caseIterationIndex < MAX_CASES-1){
      snapshotCurrentCase();
      caseIterationIndex += 1;
      clearCaseFields();
      return "CS02";
    }
    snapshotCurrentCase();
    return "FN01";
  }
  var next = resolveNextAfter(fromId);
  if(next==="CS14" && caseIterationIndex >= MAX_CASES-1){
    /* بلغنا الحد الأقصى لعدد الحالات (3) — لا يُعرض سؤال "إضافة حالة أخرى" */
    snapshotCurrentCase();
    return "FN01";
  }
  return next;
}

function trackFlowEstimate(){
  var role = answers.primary_role;
  var base = TRACK_LEN_ESTIMATE[role] || 10;
  var idn = TRACK_HAS_IDENTITY[role] ? 10 : 0;
  return base + idn + 8 + 6; /* + بطاقة حالة تقديرية + الأسئلة الختامية */
}

/* ---------------------------------------------------------------------
   أدوات مساعدة للعرض
--------------------------------------------------------------------- */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function labelFor(list, code){
  for(var i=0;i<list.length;i++) if(list[i].code===code) return list[i].label;
  return code;
}

function optionListForQuestion(q){
  if(q.poolFrom){
    var picked = answers[q.poolFrom] || [];
    return picked.map(function(code){
      var lbl = labelFor(q.poolOptions, code);
      if(code==="OTHER" && otherTexts[q.poolFrom]) lbl = "أخرى: " + otherTexts[q.poolFrom];
      return {code:code, label:lbl};
    });
  }
  return q.options || [];
}

function optionRow(opt, checked, onToggle, inputType, extraBadge){
  var row = el("label", {class:"opt" + (checked?" checked":"")});
  var input = el("input", {type:inputType, onchange:onToggle});
  input.checked = checked;
  row.appendChild(input);
  row.appendChild(el("span", {class:"lbl"}, [opt.label]));
  if(extraBadge) row.appendChild(extraBadge);
  return row;
}

function renderSingle(q){
  var wrap = el("div");
  var opts = el("div", {class:"options"});
  var current = answers[q.varName];
  q.options.forEach(function(opt){
    var checked = current===opt.code;
    opts.appendChild(optionRow(opt, checked, function(){
      answers[q.varName] = opt.code;
      if(!opt.other) delete otherTexts[q.varName];
      lastError=""; render();
    }, "radio"));
  });
  wrap.appendChild(opts);
  var chosen = q.options.filter(function(o){return o.code===current;})[0];
  if(chosen && chosen.other) wrap.appendChild(otherField(q));
  return wrap;
}

function renderMulti(q){
  var wrap = el("div");
  var opts = el("div", {class:"options"});
  var list = optionListForQuestion(q);
  var current = answers[q.varName] || [];
  var atMax = current.length >= q.max;
  list.forEach(function(opt){
    var checked = current.indexOf(opt.code) > -1;
    var disabled = !checked && atMax;
    var row = optionRow(opt, checked, function(){
      var arr = (answers[q.varName]||[]).slice();
      var i = arr.indexOf(opt.code);
      if(i>-1) arr.splice(i,1);
      else { if(arr.length>=q.max) return; arr.push(opt.code); }
      answers[q.varName] = arr;
      if(opt.code==="OTHER" && i>-1) delete otherTexts[q.varName];
      lastError=""; render();
    }, "checkbox");
    if(disabled) row.className += " disabled";
    opts.appendChild(row);
  });
  if(list.length===0) opts.appendChild(el("div", {class:"empty-pool"}, ["لا توجد خيارات متاحة بعد — عد إلى السؤال المرتبط واختر إجابة أولاً."]));
  wrap.appendChild(opts);
  wrap.appendChild(el("div", {class:"limit-note"}, ["تم اختيار " + current.length + " من " + q.max + " كحد أقصى."]));
  var hasOtherChecked = current.indexOf("OTHER")>-1 && !q.poolFrom;
  if(hasOtherChecked) wrap.appendChild(otherField(q));
  return wrap;
}

function renderText(q, isLong){
  var wrap = el("div");
  var val = answers[q.varName] || "";
  var field = isLong ? el("textarea", {oninput:function(e){answers[q.varName]=e.target.value;}})
                      : el("input", {type:"text", oninput:function(e){answers[q.varName]=e.target.value;}});
  field.value = val;
  wrap.appendChild(field);
  return wrap;
}

function otherField(q){
  var wrap = el("div", {class:"other-field"});
  var input = el("input", {type:"text", placeholder:"يرجى التوضيح…", oninput:function(e){otherTexts[q.varName]=e.target.value;}});
  input.value = otherTexts[q.varName] || "";
  wrap.appendChild(input);
  return wrap;
}

function renderRank(q){
  var wrap = el("div");
  var pool = optionListForQuestion(q);
  if(pool.length===0){
    wrap.appendChild(el("div", {class:"empty-pool"}, ["لا توجد اختيارات لترتيبها — عد إلى السؤال السابق واختر إجابة واحدة على الأقل."]));
    return wrap;
  }
  var maxRank = Math.min(q.max, pool.length);
  var current = answers[q.varName] || [];
  var opts = el("div", {class:"options"});
  pool.forEach(function(opt){
    var rankPos = current.indexOf(opt.code);
    var checked = rankPos>-1;
    var badge = checked ? el("span", {class:"rank-badge"}, [String(rankPos+1)]) : null;
    var row = optionRow(opt, checked, function(){
      var arr = current.slice();
      var i = arr.indexOf(opt.code);
      if(i>-1) arr.splice(i,1);
      else { if(arr.length>=maxRank) return; arr.push(opt.code); }
      answers[q.varName] = arr;
      lastError=""; render();
    }, "checkbox", badge);
    if(!checked && current.length>=maxRank) row.className += " disabled";
    opts.appendChild(row);
  });
  wrap.appendChild(opts);
  wrap.appendChild(el("div", {class:"limit-note"}, ["انقر على العناصر بترتيب الأولوية (١ فأعلى). المطلوب ترتيب " + maxRank + " من أصل " + pool.length + "."]));
  return wrap;
}

/* ---------------------------------------------------------------------
   التحقق
--------------------------------------------------------------------- */
function validateCurrent(){
  var q = currentQ();
  var v = answers[q.varName];
  if(q.type==="single"){
    if(q.required && !v) return "هذا السؤال إلزامي، يرجى اختيار إجابة.";
    var chosen = q.options && q.options.filter(function(o){return o.code===v;})[0];
    if(chosen && chosen.other && !(otherTexts[q.varName]||"").trim()) return "يرجى كتابة توضيح مختصر عند اختيار «أخرى».";
  } else if(q.type==="multi"){
    var arr = v||[];
    if(q.required && arr.length===0) return "هذا السؤال إلزامي، يرجى اختيار خيار واحد على الأقل.";
    if(arr.length>q.max) return "لا يمكن اختيار أكثر من " + q.max + " خيارات.";
    if(arr.indexOf("OTHER")>-1 && !q.poolFrom && !(otherTexts[q.varName]||"").trim()) return "يرجى كتابة توضيح مختصر عند اختيار «أخرى».";
  } else if(q.type==="rank"){
    var pool = optionListForQuestion(q);
    var maxRank = Math.min(q.max, pool.length);
    var arr2 = v||[];
    if(q.required && pool.length>0 && arr2.length<maxRank) return "يرجى ترتيب " + maxRank + " عناصر على الأقل.";
  } else if(q.type==="short" || q.type==="long"){
    if(q.required && !(v||"").trim()) return "هذا السؤال إلزامي، يرجى كتابة إجابة.";
  }
  return "";
}

btnNext.addEventListener("click", function(){
  if(screen==="intro"){
    qIndex = firstApplicableFrom(0,1);
    screen="question"; lastError=""; render(); return;
  }
  if(screen==="question"){
    var err = validateCurrent();
    if(err){ lastError = err; render(); return; }
    if(Q[qIndex].id==="A01" && answers.consent==="B"){ screen="declined"; lastError=""; render(); return; }
    var next = firstApplicableFrom(qIndex+1,1);
    if(next>=Q.length){
      /* نهاية الجزء المشترك — الدخول إلى المسار التخصصي بحسب primary_role (R01) */
      var entry = ENTRY_BY_ROLE[answers.primary_role] || OTHER_ROLE_ENTRY;
      trackStack = []; caseIterationIndex = 0; caseRecords = []; visitedTrackNodes = {};
      screen="track"; lastError="";
      gotoTrackNode(entry);
      render();
    }
    else { qIndex = next; lastError=""; render(); }
    return;
  }
  if(screen==="track"){
    var terr = validateCurrent();
    if(terr){ lastError = terr; render(); return; }
    var fromId = trackNodeId;
    trackStack.push(fromId);
    var tnext = advanceFromTrack(fromId);
    if(tnext==="REVIEW"){ screen="review"; lastError=""; render(); return; }
    gotoTrackNode(tnext);
    lastError=""; render();
    return;
  }
  if(screen==="review"){
    screen="done"; lastError=""; render();
    submitResponse(buildExportObject());
    return;
  }
});

btnPrev.addEventListener("click", function(){
  if(screen==="question"){
    var prev = firstApplicableFrom(qIndex-1,-1);
    if(prev<0){ screen="intro"; lastError=""; render(); }
    else { qIndex=prev; lastError=""; render(); }
    return;
  }
  if(screen==="track"){
    var prevId = trackStack.pop();
    if(prevId===undefined){
      /* لا يوجد سجل تنقل داخل المسار — الرجوع إلى آخر سؤال في الجزء المشترك */
      screen="question"; qIndex = firstApplicableFrom(Q.length-1,-1); lastError=""; render(); return;
    }
    if(trackNodeId==="CS02" && prevId==="CS14"){
      /* عبور حد تكرار بطاقة الحالة إلى الخلف — استرجاع بيانات الحالة السابقة */
      restoreLastCase();
    }
    trackNodeId = prevId; lastError=""; render(); return;
  }
  if(screen==="review"){
    if(Object.keys(visitedTrackNodes).length>0){
      screen="track"; trackNodeId="FN06"; lastError=""; render(); return;
    }
    qIndex = firstApplicableFrom(Q.length-1,-1);
    screen="question"; lastError=""; render(); return;
  }
});

/* ---------------------------------------------------------------------
   شاشة المراجعة
--------------------------------------------------------------------- */
function formatAnswer(q){
  var v = answers[q.varName];
  if(q.type==="single"){
    if(!v) return null;
    var opt = (q.options||[]).filter(function(o){return o.code===v;})[0];
    var lbl = opt?opt.label:v;
    if(opt && opt.other && otherTexts[q.varName]) lbl += "（" + otherTexts[q.varName] + "）";
    return lbl;
  }
  if(q.type==="multi"){
    var arr = v||[];
    if(arr.length===0) return null;
    var list = optionListForQuestion(q);
    var labels = arr.map(function(c){
      var o = list.filter(function(x){return x.code===c;})[0];
      var l = o?o.label:c;
      if(c==="OTHER" && otherTexts[q.varName] && !q.poolFrom) l += "（" + otherTexts[q.varName] + "）";
      return l;
    });
    return labels.join("، ");
  }
  if(q.type==="rank"){
    var arr2 = v||[];
    if(arr2.length===0) return null;
    var pool = optionListForQuestion(q);
    return arr2.map(function(c,idx){
      var o = pool.filter(function(x){return x.code===c;})[0];
      return (idx+1) + ") " + (o?o.label:c);
    }).join("  ·  ");
  }
  if(q.type==="short" || q.type==="long"){
    return (v||"").trim() || null;
  }
  return null;
}

function formatCaseValue(id, v, otherTxt){
  var meta = TRACK_Q[id];
  var opts = TRACK_OPT[id] || [];
  if(meta.type==="single"){
    if(!v) return null;
    var opt = opts.filter(function(o){return o.code===v;})[0];
    var lbl = opt ? opt.label : v;
    if(opt && opt.other && otherTxt) lbl += "（" + otherTxt + "）";
    return lbl;
  }
  if(meta.type==="multi"){
    var arr = v || [];
    if(arr.length===0) return null;
    return arr.map(function(c){
      var o = opts.filter(function(x){return x.code===c;})[0];
      var l = o ? o.label : c;
      if(c==="OTHER" && otherTxt) l += "（" + otherTxt + "）";
      return l;
    }).join("، ");
  }
  if(meta.type==="short" || meta.type==="long"){
    return (v||"").trim() || null;
  }
  return null;
}

function renderReview(){
  var box = el("div", {class:"card"});
  box.appendChild(el("h2", {}, ["مراجعة الإجابات"]));
  box.appendChild(el("p", {class:"q-help", style:"margin-top:6px"}, ["تحقق من إجاباتك قبل الإرسال. يمكنك الضغط على «تعديل» للعودة إلى أي سؤال."]));

  var currentSection = null;
  applicableList().forEach(function(q){
    if(q.section !== currentSection){
      currentSection = q.section;
      box.appendChild(el("div", {class:"section-divider"}, [currentSection]));
    }
    var ans = formatAnswer(q);
    var item = el("div", {class:"rev-item"});
    var head = el("div", {class:"rev-head"});
    head.appendChild(el("div", {class:"rev-q"}, ["[" + q.id + "] " + q.text]));
    head.appendChild(el("button", {class:"rev-edit", onclick:function(){ jumpToQuestion(q.id); }}, ["تعديل"]));
    item.appendChild(head);
    item.appendChild(el("div", {class:"rev-ans" + (ans?"":" empty")}, [ans || "بدون إجابة"]));
    box.appendChild(item);
  });

  /* المسار التخصصي + وحدة الهوية العمرانية + الأسئلة الختامية */
  var trackSection = null;
  TRACK_NONCASE_IDS.forEach(function(id){
    if(!visitedTrackNodes[id]) return;
    var meta = TRACK_Q[id];
    if(meta.track !== trackSection){
      trackSection = meta.track;
      box.appendChild(el("div", {class:"section-divider"}, [trackSection]));
    }
    var q = trackQuestionObj(id);
    var ans = formatAnswer(q);
    var item = el("div", {class:"rev-item"});
    var head = el("div", {class:"rev-head"});
    head.appendChild(el("div", {class:"rev-q"}, ["[" + id + "] " + meta.text]));
    head.appendChild(el("button", {class:"rev-edit", onclick:(function(nid){ return function(){ jumpToTrack(nid); }; })(id)}, ["تعديل"]));
    item.appendChild(head);
    item.appendChild(el("div", {class:"rev-ans" + (ans?"":" empty")}, [ans || "بدون إجابة"]));
    box.appendChild(item);
  });

  /* بطاقات الحالة التطبيقية المكتملة */
  if(caseRecords.length>0){
    box.appendChild(el("div", {class:"section-divider"}, ["بطاقة الحالة التطبيقية"]));
    caseRecords.forEach(function(rec, idx){
      var item = el("div", {class:"rev-item"});
      item.appendChild(el("div", {class:"rev-q"}, ["الحالة رقم " + (idx+1)]));
      var lines = CASE_FIELD_IDS.map(function(id){
        var meta = TRACK_Q[id];
        var lbl = formatCaseValue(id, rec[meta.varName], rec[meta.varName+"_other_text"]);
        return meta.text + "：" + (lbl || "بدون إجابة");
      });
      var ansBox = el("div", {class:"rev-ans"});
      lines.forEach(function(l){ ansBox.appendChild(el("div", {style:"margin-bottom:4px"}, [l])); });
      item.appendChild(ansBox);
      box.appendChild(item);
    });
  }

  app.appendChild(box);
}

/* ---------------------------------------------------------------------
   بناء بيانات التصدير
--------------------------------------------------------------------- */
/* أسئلة تحتوي خيار "أخرى" فعلي (غير معتمد على تجميع سؤال سابق) — تُعطى
   عمود "_other_text" ثابتاً دائماً حتى يبقى رأس الجدول منتظماً لكل المشاركين. */
var QUESTIONS_WITH_OTHER = Q.filter(function(q){
  return !q.poolFrom && q.options && q.options.some(function(o){return o.other;});
}).map(function(q){ return q.varName; });

/* يبني كائن الإجابة الكامل: كل الأسئلة الأربعين بأسماء متغيرات ثابتة دائماً،
   بقيمة فارغة لما لم يظهر لهذا المشارك (شرط ظهور لم يتحقق)، حتى يبقى
   عدد وترتيب الأعمدة ثابتاً في كل صف يصل إلى الجدول. */
function buildExportObject(){
  var applicableIds = applicableList().map(function(q){return q.id;});
  var trackVisitedIds = TRACK_NONCASE_IDS.filter(function(id){ return !!visitedTrackNodes[id]; });
  var out = {
    submitted_at: new Date().toISOString(),
    form: "survey_full_v02",
    applicable_questions: applicableIds.concat(trackVisitedIds).join("|")
  };

  /* الجزء المشترك — أربعون متغيراً ثابتة دائماً (دون أي تعديل على الإصدار السابق) */
  Q.forEach(function(q){
    var shown = applicableIds.indexOf(q.id) > -1;
    var val = shown && answers[q.varName] !== undefined ? answers[q.varName] : (q.type==="multi"||q.type==="rank" ? [] : "");
    out[q.varName] = val;
  });
  QUESTIONS_WITH_OTHER.forEach(function(varName){
    out[varName + "_other_text"] = otherTexts[varName] || "";
  });

  /* المسار التخصصي + وحدة الهوية العمرانية + الأسئلة الختامية — أعمدة ثابتة
     لكل أسئلة المسارات كافة، فارغة لكل سؤال لم يظهر فعلياً لهذا المشارك. */
  TRACK_NONCASE_IDS.forEach(function(id){
    var meta = TRACK_Q[id];
    var shown = !!visitedTrackNodes[id];
    var val = shown && answers[meta.varName] !== undefined ? answers[meta.varName] : (meta.type==="multi" ? [] : "");
    out[meta.varName] = val;
  });
  TRACK_QUESTIONS_WITH_OTHER.forEach(function(varName){
    out[varName + "_other_text"] = otherTexts[varName] || "";
  });

  /* بطاقة الحالة التطبيقية — أعمدة مرقمة ثابتة case1_/case2_/case3_ لكل
     حقل قابل للتكرار، فارغة إذا لم تُسجَّل هذه الحالة. */
  out.case_add = answers.case_add || "";
  out.case_repeat = answers.case_repeat || "";
  out.case_count = caseRecords.length;
  for(var ci=0; ci<MAX_CASES; ci++){
    (function(ci){
      var rec = caseRecords[ci];
      CASE_FIELD_IDS.forEach(function(id){
        var meta = TRACK_Q[id];
        var key = "case" + (ci+1) + "_" + meta.varName;
        out[key] = rec ? (rec[meta.varName] !== undefined ? rec[meta.varName] : (meta.type==="multi" ? [] : "")) : (meta.type==="multi" ? [] : "");
        if(CASE_FIELDS_WITH_OTHER.indexOf(id)>-1){
          out[key + "_other_text"] = rec ? (rec[meta.varName + "_other_text"] || "") : "";
        }
      });
    })(ci);
  }

  /* رمز المسار الذي أكمله المشارك، وهل ظهرت له وحدة الهوية العمرانية */
  out.completed_track_code = answers.primary_role ? (ENTRY_BY_ROLE[answers.primary_role] ? answers.primary_role : "OTHER_UNMAPPED") : "";
  out.identity_shown = trackVisitedIds.some(function(id){ return id.slice(0,2)==="ID"; }) ? "YES" : "NO";

  return out;
}

function toCsvValue(v){
  if(Array.isArray(v)) v = v.join("|");
  v = String(v===undefined||v===null?"":v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}

function buildCsv(obj){
  var keys = Object.keys(obj).filter(function(k){return k!=="meta";});
  var header = keys.join(",");
  var row = keys.map(function(k){return toCsvValue(obj[k]);}).join(",");
  return header + "\n" + row;
}

var downloadsCap = null;
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(d){ downloadsCap = d; }).catch(function(){ downloadsCap = null; });
}

function download(filename, content, mime, btn){
  var blob = new Blob([content], {type:mime});
  if(downloadsCap){
    var prevLabel = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = "جارٍ التنزيل…"; }
    downloadsCap.save({filename:filename, data:blob}).then(function(){
      if(btn){ btn.disabled = false; btn.textContent = prevLabel; }
    }).catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = prevLabel; }
      if(err && err.code==="declined") return;
      showDownloadFallback(filename, content, mime);
    });
    return;
  }
  showDownloadFallback(filename, content, mime);
}

function showDownloadFallback(filename, content, mime){
  var win = window.open("", "_blank");
  if(win && win.document){
    win.document.title = filename;
    var pre = win.document.createElement("pre");
    pre.style.whiteSpace = "pre-wrap";
    pre.style.direction = "ltr";
    pre.style.textAlign = "left";
    pre.style.fontFamily = "ui-monospace,Menlo,Consolas,monospace";
    pre.style.padding = "16px";
    pre.textContent = content;
    win.document.body.appendChild(pre);
  } else {
    alert("تعذّر حفظ الملف تلقائياً في هذه البيئة. المحتوى معروض في معاينة JSON أدناه لنسخه يدوياً.");
  }
}

function renderDone(){
  var box = el("div", {class:"card hero"});

  if(submitState==="sending"){
    box.appendChild(el("div", {class:"done-icon", style:"background:var(--surface-2);color:var(--text-muted)"}, ["…"]));
    box.appendChild(el("h1", {}, ["جارٍ إرسال إجابتك…"]));
    box.appendChild(el("p", {}, ["يرجى الانتظار لحظة."]));
  } else if(submitState==="sent"){
    box.appendChild(el("div", {class:"done-icon"}, ["✓"]));
    box.appendChild(el("h1", {}, ["تم إرسال إجابتك"]));
    box.appendChild(el("p", {}, ["شكراً لمشاركتك. تم إرسال إجاباتك لتُحفظ ضمن إجابات الاستبيان."]));
    box.appendChild(el("div", {class:"notice"}, [
      el("b", {}, ["ملاحظة: "]), "لأسباب تقنية في المتصفح لا يمكن للصفحة تأكيد استلام الخادم للبيانات بنسبة قطعية. يمكنك أيضاً تنزيل نسخة من إجابتك أدناه للاحتفاظ بها."
    ]));
  } else if(submitState==="failed"){
    box.appendChild(el("div", {class:"done-icon", style:"background:var(--danger-tint);color:var(--danger)"}, ["!"]));
    box.appendChild(el("h1", {}, ["تعذّر إرسال الإجابة تلقائياً"]));
    box.appendChild(el("p", {}, ["حدث خطأ في الاتصال أثناء الإرسال. يرجى تنزيل نسخة من إجابتك أدناه وإرسالها يدوياً، أو إعادة المحاولة لاحقاً."]));
  } else {
    box.appendChild(el("div", {class:"done-icon"}, ["✓"]));
    box.appendChild(el("h1", {}, ["تم إنهاء الاستبيان"]));
  }

  var obj = buildExportObject();
  var exportRow = el("div", {class:"export-row"});
  var jsonBtn = el("button", {class:"btn btn-accent"}, ["⭳ تصدير JSON"]);
  jsonBtn.addEventListener("click", function(){
    download("trial-response.json", JSON.stringify(obj, null, 2), "application/json", jsonBtn);
  });
  var csvBtn = el("button", {class:"btn btn-ghost"}, ["⭳ تصدير CSV"]);
  csvBtn.addEventListener("click", function(){
    download("trial-response.csv", buildCsv(obj), "text/csv;charset=utf-8", csvBtn);
  });
  exportRow.appendChild(jsonBtn);
  exportRow.appendChild(csvBtn);
  box.appendChild(exportRow);

  box.appendChild(el("div", {style:"margin-top:16px"}, [el("div",{class:"q-help",style:"margin-bottom:6px"},["معاينة JSON:"])]));
  box.appendChild(el("pre", {class:"data-preview"}, [JSON.stringify(obj, null, 2)]));

  box.appendChild(el("button", {class:"btn btn-ghost btn-block", style:"margin-top:16px", onclick:resetAll}, ["بدء تعبئة جديدة"]));
  app.appendChild(box);
}
